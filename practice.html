<h2>اليوم 1: أين يعمل الذكاء الاصطناعي، وعلى من يعتمد</h2>
<ol>
<li><p>في مديرية صحة افتراضية، يقترح فريق تشغيل نموذج توليدي مفتوح الأوزان على خوادم المديرية ليلخص محاضر اللجان الداخلية قبل اعتمادها. ما الحكم إذا قُرئ القسم 3.5 من مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية كما هو نصًّا؟</p><ul><li><b>أ.</b> يجوز ما دام النموذج على خوادم المديرية ولا تغادر المحاضر شبكتها</li><li><b>ب.</b> لا يجوز: المحاضر «مقيدة» على الأقل، والتوليدي للبيانات «العامة» فقط</li><li><b>ج.</b> يجوز بعد حذف أسماء الأعضاء من المحاضر</li><li><b>د.</b> يجوز إن وافق أعضاء اللجان كتابةً على المعالجة</li></ul></li>
<li><p>مديرية صحة افتراضية تقارن نموذجين لترجمة نشرات التوعية المنشورة. أي ورقة نتائج تقرأ منها المديرية الجودة والمسار قراءة صحيحة؟</p><ul><li><b>أ.</b> ترتيب النموذجين في لوحة مقارنة عامة، والوسيط والمئين التسعون، وأين ذهب كل طلب</li><li><b>ب.</b> نجاح كل نموذج بحسب اللغة بقاعدة كُتبت بعد قراءة الإجابات، والمئين التسعون، والمسار</li><li><b>ج.</b> نسبة نجاح واحدة للغتين بقاعدة مكتوبة قبل التشغيل، ومتوسط الزمن، والمسار</li><li><b>د.</b> نجاح كل نموذج بحسب اللغة بقاعدة مكتوبة قبل التشغيل، والوسيط والمئين التسعون، والمسار</li></ul></li>
<li><p>في مديرية صحة افتراضية، سجل اعتماد على مزوّد للترجمة. أي سطر لسيناريو «إيقاف النموذج» مكتمل؟</p><ul><li><b>أ.</b> المؤشر إشعار في بريد المسؤول الفني؛ والمحفز إشعار أقصر من 120 يومًا؛ والبديل جُرّب الشهر الماضي؛ والمعتمد مدير التقنية</li><li><b>ب.</b> المؤشر متابعة أخبار المزوّد؛ والمحفز إشعار أقصر من 120 يومًا؛ والبديل جُرّب الشهر الماضي؛ والمعتمد مدير التقنية</li><li><b>ج.</b> المؤشر إشعار في بريد المسؤول الفني؛ والمحفز إشعار أقصر من 120 يومًا؛ والبديل جاهز ولم يُجرَّب؛ والمعتمد مدير التقنية</li><li><b>د.</b> المؤشر إشعار في بريد مدير التقنية؛ والمحفز إشعار أقصر من 120 يومًا؛ والبديل جُرّب الشهر الماضي؛ والمعتمد مدير التقنية</li></ul></li>
<li><p>موظف في مديرية صحة افتراضية يلصق في أداة توليدية مستضافة نص دليل منشور على موقع المديرية ليعيد صياغته بلغة أبسط. ما مستوى ما يدخل الأداة؟</p><ul><li><b>أ.</b> مقيد: النص صادر عن جهة حكومية</li><li><b>ب.</b> عام: نص منشور للجمهور لا يكشف شيئًا غير منشور</li><li><b>ج.</b> سري: الأداة مستضافة خارج المديرية</li><li><b>د.</b> لا مستوى له حتى يُصنَّف من جديد عند كل استعمال</li></ul></li>
<li><p>مديرية صحة افتراضية تجمع في ملف واحد قائمة مراكزها الصحية المنشورة وأرقام الهواتف الشخصية لموظفيها المناوبين. ما مستوى الملف؟</p><ul><li><b>أ.</b> عام: أغلب ما في الملف منشور</li><li><b>ب.</b> بحسب الغرض الذي جُمع الملف له</li><li><b>ج.</b> مستويان في الملف: عام للقائمة ومقيد للهواتف</li><li><b>د.</b> مقيد على الأقل: الملف بأعلى ما فيه</li></ul></li>
<li><p>مديرية صحة افتراضية تريد إرسال نصوص بلاغات فيها أسماء المراجعين إلى خدمة تصنيف نصوص غير توليدية يقدمها مزوّد خارج المملكة. ماذا تحتاج قبل الإرسال؟</p><ul><li><b>أ.</b> أساسًا نظاميًّا، واستيفاء شروط النقل خارج المملكة</li><li><b>ب.</b> لا شيء ما دام المزوّد يتعهد بعدم حفظ النصوص</li><li><b>ج.</b> موافقة مكتب إدارة البيانات وحدها</li><li><b>د.</b> تشفير النصوص في أثناء النقل، فلا يُعد نقلًا خارج المملكة</li></ul></li>
<li><p>عشرة أزمنة استجابة بالمللي ثانية: 500، 520، 540، 560، 580، 600، 620، 640، 3000، 9000. ما المئين التسعون بقاعدة أقرب رتبة؟</p><ul><li><b>أ.</b> 590</li><li><b>ب.</b> 9000</li><li><b>ج.</b> 3000</li><li><b>د.</b> 1656</li></ul></li>
<li><p>مديرية صحة افتراضية قارنت نموذجين على 20 عنصرًا: نجح الأول في 17 والثاني في 15. ماذا تستنتج؟</p><ul><li><b>أ.</b> الأول أفضل، وفرق عشر نقاط مئوية حاسم</li><li><b>ب.</b> قد يأتي الفرق بالصدفة: أعد القياس على عناصر أكثر</li><li><b>ج.</b> النموذجان متساويان في الجودة</li><li><b>د.</b> الاختبار على مهام المديرية بلا قيمة، فاعتمد لوحات المقارنة</li></ul></li>
<li><p>خادم ثابت التكلفة 12,000 ريال شهريًّا، وواجهة برمجية بـ0.03 ريال للطلب، والحجم 150,000 طلب شهريًّا. ما الصحيح عن التكلفة وحدها؟</p><ul><li><b>أ.</b> الواجهة أرخص: 4,500 ريال مقابل 12,000</li><li><b>ب.</b> الخادم أرخص: تكلفته لا تزيد مع الحجم</li><li><b>ج.</b> متساويان: نقطة التساوي 150,000 طلب</li><li><b>د.</b> الواجهة أرخص، فلا مبرر للاستضافة الذاتية أبدًا</li></ul></li>
<li><p>مزوّد يرسل إشعار إيقاف نموذج بعد ثلاثة أشهر، واعتماد بديل في مديرية صحة افتراضية يستغرق خمسة أشهر. ما الدرس؟</p><ul><li><b>أ.</b> ثلاثة أشهر تكفي إن بدأت المديرية يوم الإشعار</li><li><b>ب.</b> طلب التمديد من المزوّد يكفي خطة</li><li><b>ج.</b> إبقاء النموذج يعمل بعد موعد الإيقاف حتى يجهز البديل</li><li><b>د.</b> يلزم بديل مختبَر ومحفز يسبقان الإشعار</li></ul></li>
<li><p>أي عبارة تصلح محفز خروج في سجل مديرية صحة افتراضية لخدمة ترجمة؟</p><ul><li><b>أ.</b> متابعة أخبار المزوّد يوميًّا، فيحوّل المسؤول الفني الحمل بموافقة مدير التقنية</li><li><b>ب.</b> إذا ساءت الخدمة، يقرر المسؤول الفني ومدير التقنية في حينه ما يفعلان</li><li><b>ج.</b> المئين التسعون فوق 8 ثوانٍ ثلاثة أيام، فيحوّل المسؤول الفني الحمل بموافقة مدير التقنية</li><li><b>د.</b> المئين التسعون فوق 8 ثوانٍ ثلاثة أيام، فيحوّل المسؤول الفني الحمل بقراره وحده</li></ul></li>
<li><p>نقلت مديرية صحة افتراضية نموذجًا مفتوح الأوزان إلى خوادمها لتقلل اعتمادها على المزوّد. أي اعتماد ما زال قائمًا؟</p><ul><li><b>أ.</b> لا شيء، فنسخة الأوزان عندها</li><li><b>ب.</b> الطاقة والمسرّعات وفريق يشغّل النموذج</li><li><b>ج.</b> تحديثات إلزامية من المزوّد توقف النسخة إن لم تُثبَّت</li><li><b>د.</b> ترخيص المزوّد السحابي</li></ul></li>
<li><p>أي موقف لحمل واحد في مذكرة مديرية صحة افتراضية مكتمل؟</p><ul><li><b>أ.</b> الأول في لوحات المقارنة، ومحفز بمالك ومعتمد، وبديل جُرّب</li><li><b>ب.</b> دليل من مهامنا، ومحفز بمالك ومعتمد، وبديل نجربه عند الحاجة</li><li><b>ج.</b> دليل من مهامنا، ومحفز «نراقب الوضع»، وبديل جُرّب</li><li><b>د.</b> دليل من مهامنا، ومحفز بمالك ومعتمد، وبديل جُرّب</li></ul></li>
<li><p>في سجل مديرية صحة افتراضية، طلب مدير التقنية التحول إلى المزوّد البديل. من يعتمد الطلب؟</p><ul><li><b>أ.</b> مدير التقنية نفسه، فهو أعلم بالخدمة</li><li><b>ب.</b> المزوّد البديل الذي سيقدم الخدمة</li><li><b>ج.</b> دور آخر مسمى في السجل</li><li><b>د.</b> أول موظف في الفريق الفني يرى الطلب</li></ul></li>
<li><p>رفع المزوّد سعره 40%، فصارت تكلفة حمل في مديرية صحة افتراضية 14,000 ريال سنويًّا، وحدها المعتمد 30,000. ما الموقف؟</p><ul><li><b>أ.</b> البقاء، مع تحديث الرقم في السجل</li><li><b>ب.</b> الخروج فورًا، فأي زيادة في السعر محفز</li><li><b>ج.</b> تجاهل السعر، فالجودة وحدها تحكم القرار</li><li><b>د.</b> إيقاف الحمل حتى تُعتمد ميزانية جديدة</li></ul></li>
<li><p>جمعت مديرية صحة افتراضية مواعيد المراجعين وأسماءهم لحجز المواعيد، ثم أرادت إرسالها إلى مزوّد ليدرّب بها نموذجه. ما المشكلة الأولى في نظام حماية البيانات الشخصية؟</p><ul><li><b>أ.</b> غرض التدريب غير غرض الحجز، فيحتاج إلى أساس نظامي جديد</li><li><b>ب.</b> لا مشكلة ما دام المزوّد يعمل من منطقة سحابية داخل المملكة</li><li><b>ج.</b> المشكلة في التكلفة وحدها، فالتدريب مكلف</li><li><b>د.</b> لا مشكلة بعد حذف الأسماء، وإن بقيت المواعيد مرتبطة برقم الملف</li></ul></li>
<li><p>تستعمل مديرية صحة افتراضية منطقة سحابية داخل المملكة يديرها مزوّد أجنبي عن بعد. أي سيطرة تبقى ناقصة وإن بقيت البيانات في المملكة؟</p><ul><li><b>أ.</b> لا شيء، فموقع البيانات يحسم السيادة</li><li><b>ب.</b> البيانات وحدها، لأنها تُرسل إلى المنطقة السحابية للمعالجة</li><li><b>ج.</b> النموذج وحده، ويُحل بعقد أطول مع المزوّد</li><li><b>د.</b> التشغيل والولاية: من يدير الخدمة، ومن يأمره</li></ul></li>
<li><p>فريق في مديرية صحة افتراضية يجرب فئة مجانية لنموذج مستضاف، وشروطها تسمح للمزوّد باستعمال المدخلات وقد يقرؤها مراجعون. ماذا يرسل إليها؟</p><ul><li><b>أ.</b> النشرات المنشورة، ومسودات النشرات القادمة قبل نشرها</li><li><b>ب.</b> عناصر اختبار اصطناعية كتبها الفريق، ولا شيء غيرها</li><li><b>ج.</b> أي نص من عمل المديرية بعد حذف الأسماء منه</li><li><b>د.</b> ما يشاء، فالفئة المجانية لا تحفظ المدخلات</li></ul></li>
<li><p>نجح نموذج في 18 من 20 عنصرًا: 10 من 10 بالإنجليزية، و8 من 10 بالعربية، والعنصران الخاسران سؤالان باللهجة المحلية. ماذا تكتب المديرية في ورقة النتائج؟</p><ul><li><b>أ.</b> نسبة نجاح 90% للغتين معًا، فالنموذج صالح للعمل بهما</li><li><b>ب.</b> إخفاقان من عشرين لا يستحقان الذكر</li><li><b>ج.</b> النجاح بحسب اللغة، ونوع الإخفاقين: أسئلة اللهجة</li><li><b>د.</b> النموذج لا يصلح للعربية، فيُستبعد</li></ul></li>
<li><p>بديل محلي في مديرية صحة افتراضية يجيب في نحو 15 ثانية للطلب، بخانة تشغيل واحدة، وذروة الحمل 300 طلب في الساعة. ما الصحيح؟</p><ul><li><b>أ.</b> لا يكفي الذروة: سعته نحو 240 طلبًا في الساعة</li><li><b>ب.</b> يكفي، فهو يجيب عن كل طلب في النهاية</li><li><b>ج.</b> يكفي إن كانت جودته العربية أعلى من المزوّد الرئيس</li><li><b>د.</b> السعة لا تهم في البديل، فهو مؤقت</li></ul></li>
<li><p>أي مما يلي مؤشر إنذار يصلح لسيناريو انقطاع في مركز بيانات المزوّد؟</p><ul><li><b>أ.</b> متابعة الأخبار عن قطاع الطاقة</li><li><b>ب.</b> شكاوى المستخدمين بعد توقف الخدمة</li><li><b>ج.</b> قرار مدير التقنية بالتحول إلى البديل</li><li><b>د.</b> المئين التسعون في سجل الطلبات اليومي يتجاوز حده، ويقرؤه المسؤول الفني</li></ul></li>
<li><p>كتب فريق في مذكرة مديرية صحة افتراضية أن البديل «جاهز» لأنه شُغّل مرة قبل سنة. ما الخلل؟</p><ul><li><b>أ.</b> لا خلل، فتمرين واحد يكفي</li><li><b>ب.</b> تمرين قديم لا يثبت الجاهزية اليوم، فيلزم تمرين حديث</li><li><b>ج.</b> الخلل أن البديل محلي، والبديل يجب أن يكون مستضافًا</li><li><b>د.</b> يكفي أن يتعهد مزوّد البديل كتابةً بأنه جاهز عند الحاجة</li></ul></li>
<li><p>حد تقبل المخاطر في مديرية صحة افتراضية: جودة عربية لا تقل عن 85%. البديل المختبَر حقق 70% بالعربية على عناصرها. ما الموقف المتسق مع الحد؟</p><ul><li><b>أ.</b> يُعتمد البديل دون ذكر الحد، فالبديل أفضل من لا شيء</li><li><b>ب.</b> يُتجاهل الحد في الطوارئ، ويُترك القرار كله للفريق الفني</li><li><b>ج.</b> تذكر المذكرة أن البديل دون الحد، ومن يعتمد قبوله مؤقتًا</li><li><b>د.</b> يُرفض كل بديل، ويُبقى على المزوّد الرئيس مهما حدث من انقطاع</li></ul></li>
</ol>
